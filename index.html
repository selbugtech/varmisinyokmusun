<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viperteam · Var mısın Yok musun?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/temel.css">
    <link rel="stylesheet" href="css/tema.css">
</head>
<body>
    <div id="sahne">
        <div class="sahne-fon"></div>

        <header class="ust">
            <div class="baslik">
                <img class="logo" src="img/16.jpg" alt="">
                <div>
                    <div class="baslik-ana" id="baslik-ana"></div>
                    <div class="baslik-alt" id="baslik-alt"></div>
                </div>
            </div>

            <div class="mesaj-kutu">
                <div id="mesaj"></div>
            </div>

            <div class="sag-bilgi">
                <div class="turlar-kutu">
                    <span class="kucuk-baslik">TURLAR</span>
                    <div id="turlar"></div>
                </div>
                <div class="benim-kutu">
                    <span class="kucuk-baslik">SENİN KASAN</span>
                    <div id="benim-kasa"></div>
                </div>
            </div>
        </header>

        <main class="alan">
            <aside class="liste" id="liste-sol"></aside>
            <section class="masa" id="masa"></section>
            <aside class="liste" id="liste-sag"></aside>
        </main>

        <div class="teklif" id="teklif">
            <div class="teklif-ic">
                <div class="telefon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
                </div>
                <div class="teklif-tur" id="teklif-tur"></div>
                <div class="teklif-baslik">Hamdi Bey arıyor...</div>
                <div class="teklif-alt">Teklifi sunucu söyleyecek</div>
                <div class="teklif-butonlar">
                    <button class="btn btn-var" id="btn-var">VAR MISIN?<kbd>V</kbd></button>
                    <button class="btn btn-yok" id="btn-yok">YOK MUSUN?<kbd>Y</kbd></button>
                </div>
            </div>
        </div>

        <div class="sonuc" id="sonuc">
            <div class="sonuc-ic">
                <div class="sonuc-baslik" id="sonuc-baslik"></div>
                <div class="sonuc-alt" id="sonuc-alt"></div>
                <div id="sonuc-kart"></div>
                <button class="btn btn-var" id="btn-tekrar">TEKRAR OYNA<kbd>R</kbd></button>
            </div>
        </div>

        <div class="yazilan" id="yazilan"></div>
        <div class="bildirim" id="bildirim"></div>
        <button class="ses" id="ses" title="Ses (M)">
            <svg class="ses-acik" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <svg class="ses-kapali" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.45 2.45c.03-.2.05-.42.05-.65zM19 12c0 .94-.2 1.82-.54 2.64l1.5 1.5A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.1a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
        </button>
    </div>

    <script src="js/ayarlar.js"></script>
    <script src="js/ses.js"></script>
    <script src="js/konfeti.js"></script>
    <script src="js/oyun.js"></script>
</body>
</html>
